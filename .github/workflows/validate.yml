name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify committed security workflow blobs
        run: python3 scripts/verify_security_workflow_blobs.py --revision HEAD
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Install public runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install bounded browser runtime
        run: npx playwright install --with-deps chromium
      - name: Rebuild committed public runtime
        run: |
          npm run build
          git diff --exit-code
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate canonical globe core
        run: make validate
      - name: Run failure-safe browser smoke
        run: npm run smoke:browser
      - name: Verify private vulnerability reporting before merge
        id: security_setting
        continue-on-error: true
        run: >-
          python3 scripts/validate_security_policy.py
          --verify-live-setting
          --repository "${{ github.repository }}"
          --expected-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --receipt artifacts/commonworld-private-vulnerability-reporting-premerge.json
      - name: Upload pre-merge security receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: commonworld-private-vulnerability-reporting-premerge-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/commonworld-private-vulnerability-reporting-premerge.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce pre-merge security readback
        if: always() && steps.security_setting.outcome != 'success'
        run: exit 1
