name: validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  locale-review-closeout:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/locale-review-closeout-v1'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/locale-review-closeout-v1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Apply review closeout
        run: python3 scripts/apply_locale_review_closeout.py
      - name: Restore canonical execution surface
        run: |
          git fetch origin main --depth=1
          rm -f scripts/apply_locale_review_closeout.py
          rm -f docs/evidence/locale-candidates/.gitkeep-closeout*
          git checkout origin/main -- .github/workflows/validate.yml
      - name: Install public runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install bounded browser runtime
        run: npx playwright install --with-deps chromium
      - name: Rebuild deterministic public runtime
        run: npm run build
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate canonical contracts and tests
        run: make validate
      - name: Run complete browser smoke plan
        run: npm run smoke:browser
      - name: Commit verified implementation
        env:
          BRANCH: fix/locale-review-closeout-v1
        run: |
          git config user.name "commonworld-review-closeout[bot]"
          git config user.email "commonworld-review-closeout[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(i18n): close Wave-1 locale review findings"
          git push --force-with-lease origin "HEAD:${BRANCH}"

  contracts:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install public runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install bounded browser runtime
        run: npx playwright install --with-deps chromium
      - name: Rebuild committed public runtime
        run: |
          npm run build
          git diff --exit-code
      - name: Self-test complete release snapshot readback
        run: python3 .github/production-readback/verify_release_snapshot_live.py --self-test
      - name: Self-test production readback commit status
        run: python3 .github/production-readback/publish_commit_status.py --self-test
      - name: Validate production readback status workflow contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readback = Path(".github/workflows/production-readback.yml").read_text(
              encoding="utf-8"
          )

          assert "statuses: write" in readback
          assert "Publish terminal production readback commit status" in readback
          assert "--mode final" in readback
          assert "--mode pending" not in readback
          assert "Mark production readback pending" not in readback
          assert 'print(f"state={state}")' in readback
          assert "steps.commit_status.outcome != 'success'" in readback
          assert "steps.commit_status.outputs.state != 'success'" in readback
          assert "contents: write" not in readback
          print("commonworld terminal production readback status workflow contract ok")
          PY
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate canonical globe core
        run: make validate
      - name: Run failure-safe browser smoke
        run: npm run smoke:browser
