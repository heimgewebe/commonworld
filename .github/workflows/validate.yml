name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify trusted security bootstrap
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_BOOTSTRAP_SHA256: baa06f6a938ffcc2e3b95eefac0acdc3a04c29e42519df11b576ba801692b85c
        run: |
          python3 -I -S - <<'PY'
          import hashlib
          import os
          import pathlib
          import stat
          import subprocess
          import sys

          path = pathlib.Path("scripts/verify_security_workflow_blobs.py")
          expected_sha = os.environ["EXPECTED_SHA"].lower()
          expected_digest = os.environ["EXPECTED_BOOTSTRAP_SHA256"].lower()

          def git(*arguments):
              result = subprocess.run(
                  ["git", *arguments],
                  check=False,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if result.returncode != 0:
                  raise SystemExit(result.stderr.decode("utf-8", errors="replace"))
              return result.stdout

          head = git("rev-parse", "HEAD").decode("ascii").strip().lower()
          if head != expected_sha:
              raise SystemExit(f"checkout revision mismatch: expected {expected_sha}, got {head}")
          metadata = path.lstat()
          if not stat.S_ISREG(metadata.st_mode):
              raise SystemExit("security bootstrap worktree path is not a regular file")
          entries = [entry for entry in git("ls-tree", "-z", "HEAD", "--", str(path)).split(b"\0") if entry]
          if len(entries) != 1 or b"\t" not in entries[0]:
              raise SystemExit("security bootstrap must resolve to one committed tree entry")
          header, committed_path = entries[0].split(b"\t", 1)
          mode, object_type, object_id = (part.decode("ascii") for part in header.split())
          if committed_path.decode("utf-8") != str(path) or mode != "100755" or object_type != "blob":
              raise SystemExit("security bootstrap committed entry mismatch")
          blob = git("cat-file", "blob", object_id)
          digest = hashlib.sha256(blob).hexdigest()
          if digest != expected_digest:
              raise SystemExit(f"security bootstrap digest mismatch: expected {expected_digest}, got {digest}")
          if path.read_bytes() != blob:
              raise SystemExit("security bootstrap worktree differs from committed blob")
          PY
          python3 -I -S scripts/verify_security_workflow_blobs.py \
            --revision HEAD \
            --expected-sha "$EXPECTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Install public runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install bounded browser runtime
        run: npx playwright install --with-deps chromium
      - name: Rebuild committed public runtime
        run: |
          npm run build
          git diff --exit-code
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate canonical globe core
        run: make validate
      - name: Run failure-safe browser smoke
        run: npm run smoke:browser
      - name: Verify private vulnerability reporting before merge
        id: security_setting
        continue-on-error: true
        run: >-
          python3 -I scripts/validate_security_policy.py
          --verify-live-setting
          --repository "${{ github.repository }}"
          --expected-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --receipt artifacts/commonworld-private-vulnerability-reporting-premerge.json
      - name: Upload pre-merge security receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: commonworld-private-vulnerability-reporting-premerge-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/commonworld-private-vulnerability-reporting-premerge.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce pre-merge security readback
        if: always() && steps.security_setting.outcome != 'success'
        run: exit 1
