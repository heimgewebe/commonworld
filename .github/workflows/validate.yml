name: validate-pr-198-final-tree

on:
  push:
    branches:
      - fix/wave1-nonblocking-globe-v1

permissions:
  contents: write

jobs:
  validate-final-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/wave1-nonblocking-globe-v1
          fetch-depth: 50
      - name: Materialize final tree locally
        run: |
          git config user.name "grabowski-operator"
          git config user.email "grabowski-operator@users.noreply.github.com"
          git show 6d75eb997b178f0df9bc28171dbbeb91ff2e9241:.github/workflows/validate.yml > .github/workflows/validate.yml
          python3 scripts/measure_release_snapshot_lifecycle.py
          git add .github/workflows/validate.yml docs/evidence/release-snapshot-lifecycle-v1.json
          git diff --cached --check
          git commit -m "fix(i18n): bind late locale recovery evidence"
          echo "FINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install public runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install bounded browser runtime
        run: npx playwright install --with-deps chromium
      - name: Rebuild committed public runtime
        run: |
          npm run build
          git diff --exit-code
      - name: Self-test release and readback contracts
        run: |
          python3 .github/production-readback/verify_release_snapshot_live.py --self-test
          python3 .github/production-readback/publish_commit_status.py --self-test
          python3 - <<'PY'
          from pathlib import Path
          readback = Path('.github/workflows/production-readback.yml').read_text(encoding='utf-8')
          assert 'statuses: write' in readback
          assert 'Publish terminal production readback commit status' in readback
          assert '--mode final' in readback
          assert '--mode pending' not in readback
          assert 'Mark production readback pending' not in readback
          assert 'print(f"state={state}")' in readback
          assert "steps.commit_status.outcome != 'success'" in readback
          assert "steps.commit_status.outputs.state != 'success'" in readback
          assert 'contents: write' not in readback
          PY
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate canonical globe core
        run: make validate
      - name: Run failure-safe browser smoke
        run: npm run smoke:browser
      - name: Verify final diff and push exact validated head
        run: |
          git diff --check origin/main...HEAD
          test "$(git rev-parse HEAD)" = "$FINAL_HEAD"
          git push origin HEAD:fix/wave1-nonblocking-globe-v1
