name: repair-pr-198

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 198 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Apply late Wave-1 completion fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          i18n = Path('assets/commonworld-i18n.mjs')
          source = i18n.read_text(encoding='utf-8')
          old = 'wave1LocalePackReady = loadWave1LocalePacks()\n'
          new = 'wave1LocalePackReady = loadWave1LocalePacks({ timeoutMs: 0 })\n'
          if source.count(old) != 1:
              raise SystemExit(f'expected one runtime Wave-1 load site, found {source.count(old)}')
          source = source.replace(old, new)
          source = source.replace(
              '// Consumers that require the complete Wave-1 vocabulary can await this promise explicitly.\n// The module itself stays synchronous so an optional translation download can never gate the globe.\n',
              '// Runtime startup never times out the eventual Wave-1 import: the globe can render immediately,\n// while a slow but successful pack still relocalizes the live UI when it finally arrives.\n// Explicit callers of loadWave1LocalePacks can still request a bounded timeout.\n',
          )
          i18n.write_text(source, encoding='utf-8')

          smoke = Path('scripts/smoke_locale_candidates_browser.mjs')
          source = smoke.read_text(encoding='utf-8')
          timer_patch = '''    await context.addInitScript(() => {
              const nativeSetTimeout = globalThis.setTimeout.bind(globalThis);
              globalThis.setTimeout = (callback, delay, ...args) => nativeSetTimeout(
                callback,
                delay === 2_500 ? 60_000 : delay,
                ...args,
              );
            });
'''.replace('          ', '')
          if source.count(timer_patch) != 1:
              raise SystemExit(f'expected one timer monkeypatch, found {source.count(timer_patch)}')
          source = source.replace(timer_patch, '')

          old_tail = '''    await heldLocalePackRoute.abort('failed');
    await page.waitForTimeout(50);
    assert(pageErrors.length === 0, `${pageName}: pending-pack page errors: ${pageErrors.join(' | ')}`);
    const fallbackWarnings = warnings.filter((message) => message.includes('Wave-1 locale pack unavailable'));
    assert(fallbackWarnings.length === 1, `${pageName}: expected one pending-pack fallback warning, got ${fallbackWarnings.length}: ${warnings.join(' | ')}`);
    localePackResilience.push({ page: pageName, locale: candidate.locale, surface: 'globe', pendingPackNonBlocking: true, verdict: 'PASS' });
'''
          new_tail = '''    const pendingCount = (await page.locator('#text-count').textContent()) ?? '';
    assert(pendingCount.includes('Commons'), `${pageName}: pending locale pack did not use the English runtime fallback: ${pendingCount}`);
    await page.waitForTimeout(2_800);
    await heldLocalePackRoute.continue();
    await page.waitForFunction(
      () => document.querySelector('.globe-stage')?.dataset.localePack === 'ready',
      null,
      { timeout: 5_000 },
    );
    await page.waitForFunction(
      () => document.querySelector('#text-count')?.textContent?.includes('Communs'),
      null,
      { timeout: 5_000 },
    );
    assert(pageErrors.length === 0, `${pageName}: late-pack page errors: ${pageErrors.join(' | ')}`);
    const fallbackWarnings = warnings.filter((message) => message.includes('Wave-1 locale pack unavailable'));
    assert(fallbackWarnings.length === 0, `${pageName}: late successful locale pack was treated as failed: ${warnings.join(' | ')}`);
    localePackResilience.push({
      page: pageName,
      locale: candidate.locale,
      surface: 'globe',
      pendingPackNonBlocking: true,
      latePackRelocalized: true,
      verdict: 'PASS',
    });
'''
          if source.count(old_tail) != 1:
              raise SystemExit(f'expected one pending-pack tail, found {source.count(old_tail)}')
          smoke.write_text(source.replace(old_tail, new_tail), encoding='utf-8')
          PY
      - name: Rebuild content-addressed public release
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          node --test tests/js/*.test.mjs
      - name: Commit repaired PR head
        run: |
          git show HEAD^:.github/workflows/validate.yml > .github/workflows/validate.yml
          git config user.name "grabowski-operator"
          git config user.email "grabowski-operator@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(i18n): preserve late Wave-1 locale completion"
          git push origin HEAD:${{ github.head_ref }}
