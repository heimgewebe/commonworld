name: zh-hans-branch-bootstrap

on:
  push:
    branches:
      - feat/zh-hans-complete-v1

permissions:
  contents: write

jobs:
  bootstrap:
    if: contains(github.event.head_commit.message, 'bootstrap zh-Hans translation draft')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/zh-hans-complete-v1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install one-shot draft writer
        run: python -m pip install --disable-pip-version-check 'deep-translator==1.11.4'
      - name: Generate Simplified Chinese review draft
        run: python scripts/_tmp_generate_zh_hans.py
      - name: Rebuild deterministic public runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Remove one-shot bootstrap machinery
        run: rm scripts/_tmp_generate_zh_hans.py .github/workflows/zh-hans-bootstrap.yml
      - name: Commit reviewable draft and generated runtime
        run: |
          git config user.name 'grabowski-operator'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'feat(i18n): add complete zh-Hans review draft'
          git push origin HEAD:feat/zh-hans-complete-v1
