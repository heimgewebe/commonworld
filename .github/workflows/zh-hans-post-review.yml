name: zh-hans-post-review-polish

on:
  push:
    branches:
      - feat/zh-hans-complete-v1

permissions:
  contents: write

jobs:
  polish:
    if: contains(github.event.head_commit.message, 'run zh-Hans post-review polish')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/zh-hans-complete-v1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Apply post-review language polish
        run: PYTHONPATH=. python scripts/_tmp_zh_hans_post_review.py
      - name: Rebuild deterministic runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Run language regressions
        run: |
          python -m unittest tests.test_i18n tests.test_locale_wave1 -v
          npm test
      - name: Remove one-shot machinery
        run: rm scripts/_tmp_zh_hans_post_review.py .github/workflows/zh-hans-post-review.yml
      - name: Commit post-review source
        run: |
          git config user.name 'grabowski-operator'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'fix(i18n): polish zh-Hans after full-corpus review'
          git push origin HEAD:feat/zh-hans-complete-v1
