name: production-readback

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: commonworld-production-readback-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify-exact-pages-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Verify committed security workflow blobs
        run: python3 scripts/verify_security_workflow_blobs.py --revision HEAD

      - name: Verify exact Pages deployment and public content
        id: readback
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMONWORLD_PAGES_URL: https://commonworld.net/
        run: >-
          python3 scripts/verify_pages_deployment.py
          --repository "${{ github.repository }}"
          --sha "${{ github.sha }}"
          --source-ref main
          --receipt artifacts/commonworld-pages-production-readback.json
          --deployment-timeout-seconds 600
          --deployment-poll-seconds 10
          --live-timeout-seconds 5
          --live-retry-delays-seconds 0,30,90

      - name: Install security validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify private vulnerability reporting setting
        id: security_setting
        continue-on-error: true
        run: >-
          python3 scripts/validate_security_policy.py
          --verify-live-setting
          --repository "${{ github.repository }}"
          --expected-sha "${{ github.sha }}"
          --receipt artifacts/commonworld-private-vulnerability-reporting.json

      - name: Upload Pages production readback receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: commonworld-pages-production-readback-${{ github.sha }}
          path: artifacts/commonworld-pages-production-readback.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload private reporting readback receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: commonworld-private-vulnerability-reporting-${{ github.sha }}
          path: artifacts/commonworld-private-vulnerability-reporting.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce production readback result
        if: always() && (steps.readback.outcome != 'success' || steps.security_setting.outcome != 'success')
        run: exit 1
