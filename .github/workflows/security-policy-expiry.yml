name: security-policy-expiry

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commonworld-security-policy-expiry
  cancel-in-progress: false

jobs:
  validate-security-policy-expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify committed security workflow blobs
        run: python3 scripts/verify_security_workflow_blobs.py --revision HEAD
      - name: Install security validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate disclosure policy and expiry
        run: python3 scripts/validate_security_policy.py
      - name: Verify private vulnerability reporting remains enabled
        id: security_setting
        if: always()
        continue-on-error: true
        run: >-
          python3 scripts/validate_security_policy.py
          --verify-live-setting
          --repository "${{ github.repository }}"
          --expected-sha "${{ github.sha }}"
          --receipt artifacts/commonworld-private-vulnerability-reporting-scheduled.json
      - name: Upload scheduled security receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: commonworld-private-vulnerability-reporting-scheduled-${{ github.sha }}
          path: artifacts/commonworld-private-vulnerability-reporting-scheduled.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce live reporting result
        if: always() && steps.security_setting.outcome != 'success'
        run: exit 1
