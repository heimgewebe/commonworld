name: pr143-followup

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: pr143-followup
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'feat/digital-detail-unification-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/digital-detail-unification-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          python -m pip install -r requirements-dev.txt
      - name: Apply exact-head review fixes
        run: |
          if [[ -f docs/evidence/pr143-followup-error.tmp.txt ]]; then
            cat docs/evidence/pr143-followup-error.tmp.txt
            exit 1
          fi
          set +e
          python scripts/pr143_followup.py patch > /tmp/pr143-patch.log 2>&1
          status=$?
          set -e
          cat /tmp/pr143-patch.log
          if [[ $status -ne 0 ]]; then
            cp /tmp/pr143-patch.log docs/evidence/pr143-followup-error.tmp.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/evidence/pr143-followup-error.tmp.txt
            git commit -m "chore: record PR 143 follow-up failure"
            git push origin HEAD:feat/digital-detail-unification-v1
            exit $status
          fi
          npm run build
          git diff --check
          python scripts/validate_public_maplibre_vertical_slice.py
          python -m unittest tests.test_public_shell
      - name: Measure exact static delivery
        run: python scripts/measure_catalog_delivery.py --output /tmp/pr143-static.json
      - name: Measure exact browser delivery five times
        run: |
          for index in 1 2 3 4 5; do
            node scripts/measure_catalog_delivery_browser.mjs --output "/tmp/pr143-browser-${index}.json"
          done
          python scripts/pr143_followup.py select-browser \
            --output /tmp/pr143-browser.json \
            /tmp/pr143-browser-1.json \
            /tmp/pr143-browser-2.json \
            /tmp/pr143-browser-3.json \
            /tmp/pr143-browser-4.json \
            /tmp/pr143-browser-5.json
      - name: Run exact public browser evidence
        run: node scripts/smoke_public_browser.mjs --result /tmp/pr143-smoke.json
      - name: Bind exact evidence
        run: |
          python scripts/pr143_followup.py bind \
            --static /tmp/pr143-static.json \
            --browser /tmp/pr143-browser.json \
            --smoke /tmp/pr143-smoke.json
      - name: Remove temporary follow-up machinery
        run: |
          rm -f .github/workflows/pr143-followup.yml
          rm -f scripts/pr143_followup.py
          rm -f docs/evidence/pr143-followup-error.tmp.txt
      - name: Validate final product tree
        run: |
          git diff --check
          make validate
          npm run smoke:browser
          git diff --check
          git diff --exit-code -- assets/commonworld-bootstrap-catalog.mjs assets/commonworld-en-locale.mjs de.html index.html method.de.html method.html || true
      - name: Commit final exact-head fixes
        env:
          BRANCH: feat/digital-detail-unification-v1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve digital lane focus context"
          git fetch origin main
          git diff --binary origin/main...HEAD > /tmp/pr143-final.diff
          printf 'FINAL_HEAD=%s\n' "$(git rev-parse HEAD)"
          printf 'FINAL_DIFF_SHA256=%s\n' "$(sha256sum /tmp/pr143-final.diff | cut -d' ' -f1)"
          printf 'FINAL_DIFF_BYTES=%s\n' "$(wc -c < /tmp/pr143-final.diff)"
          git push origin "HEAD:${BRANCH}"
