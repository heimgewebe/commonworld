name: production-readback-finalizer

on:
  workflow_run:
    workflows:
      - production-readback
    types:
      - completed

permissions:
  statuses: write

jobs:
  finalize-non-successful-readback:
    if: github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish terminal failure status
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const run = context.payload.workflow_run;
            const conclusion = run.conclusion || "unknown";
            const description = (
              `production readback ${conclusion} before a durable terminal result`
            ).slice(0, 140);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: run.head_sha,
              state: "failure",
              context: "commonworld/production-readback",
              description,
              target_url: run.html_url,
            });
