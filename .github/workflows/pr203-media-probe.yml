name: PR203 reduced-motion probe

on:
  push:
    branches:
      - fix/touch-ring-orbit-v1

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install browser probe dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Probe Chromium reduced-motion transition
        run: node .github/pr203_media_probe.mjs | tee pr203-media-probe.log
      - name: Preserve probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr203-media-probe-log
          path: pr203-media-probe.log
          if-no-files-found: error
