name: Patch security policy final

on:
  push:
    branches:
      - feat/security-policy-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/security-policy-v1
          fetch-depth: 0
      - name: Apply reviewed security workflow hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          validate_yml = '''name: validate

          on:
            pull_request:
            push:
              branches:
                - main

          permissions:
            contents: read

          jobs:
            contracts:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v7
                - uses: actions/setup-python@v7
                  with:
                    python-version: "3.12"
                - uses: actions/setup-node@v7
                  with:
                    node-version: "22"
                    cache: npm
                - name: Install public runtime dependencies
                  run: npm ci --ignore-scripts --no-audit --no-fund
                - name: Install bounded browser runtime
                  run: npx playwright install --with-deps chromium
                - name: Rebuild committed public runtime
                  run: |
                    npm run build
                    git diff --exit-code
                - name: Install validation dependencies
                  run: python -m pip install -r requirements-dev.txt
                - name: Validate canonical globe core
                  run: make validate
                - name: Run failure-safe browser smoke
                  run: npm run smoke:browser
                - name: Verify private vulnerability reporting before merge
                  id: security_setting
                  continue-on-error: true
                  run: >-
                    python3 scripts/validate_security_policy.py
                    --verify-live-setting
                    --repository "${{ github.repository }}"
                    --expected-sha "${{ github.event.pull_request.head.sha || github.sha }}"
                    --receipt artifacts/commonworld-private-vulnerability-reporting-premerge.json
                - name: Upload pre-merge security receipt
                  if: always()
                  uses: actions/upload-artifact@v7
                  with:
                    name: commonworld-private-vulnerability-reporting-premerge-${{ github.event.pull_request.head.sha || github.sha }}
                    path: artifacts/commonworld-private-vulnerability-reporting-premerge.json
                    if-no-files-found: error
                    retention-days: 30
                - name: Enforce pre-merge security readback
                  if: always() && steps.security_setting.outcome != 'success'
                  run: exit 1
          '''
          validate_yml = "\n".join(line[10:] if line.startswith("          ") else line for line in validate_yml.splitlines()) + "\n"

          production_yml = '''name: production-readback

          on:
            push:
              branches:
                - main
            workflow_dispatch:

          permissions:
            contents: read
            deployments: read

          concurrency:
            group: commonworld-production-readback-${{ github.sha }}
            cancel-in-progress: false

          jobs:
            verify-exact-pages-deployment:
              runs-on: ubuntu-latest
              timeout-minutes: 20
              steps:
                - name: Check out exact commit
                  uses: actions/checkout@v7
                  with:
                    ref: ${{ github.sha }}

                - name: Set up Python
                  uses: actions/setup-python@v7
                  with:
                    python-version: "3.12"

                - name: Verify exact Pages deployment and public content
                  id: readback
                  continue-on-error: true
                  env:
                    GITHUB_TOKEN: ${{ github.token }}
                    COMMONWORLD_PAGES_URL: https://commonworld.net/
                  run: >-
                    python3 scripts/verify_pages_deployment.py
                    --repository "${{ github.repository }}"
                    --sha "${{ github.sha }}"
                    --source-ref main
                    --receipt artifacts/commonworld-pages-production-readback.json
                    --deployment-timeout-seconds 600
                    --deployment-poll-seconds 10
                    --live-timeout-seconds 5
                    --live-retry-delays-seconds 0,30,90

                - name: Install security validation dependencies
                  run: python -m pip install -r requirements-dev.txt

                - name: Verify private vulnerability reporting setting
                  id: security_setting
                  if: always()
                  continue-on-error: true
                  run: >-
                    python3 scripts/validate_security_policy.py
                    --verify-live-setting
                    --repository "${{ github.repository }}"
                    --expected-sha "${{ github.sha }}"
                    --receipt artifacts/commonworld-private-vulnerability-reporting.json

                - name: Upload Pages production readback receipt
                  if: always()
                  uses: actions/upload-artifact@v7
                  with:
                    name: commonworld-pages-production-readback-${{ github.sha }}
                    path: artifacts/commonworld-pages-production-readback.json
                    if-no-files-found: error
                    retention-days: 30

                - name: Upload private reporting production receipt
                  if: always()
                  uses: actions/upload-artifact@v7
                  with:
                    name: commonworld-private-vulnerability-reporting-${{ github.sha }}
                    path: artifacts/commonworld-private-vulnerability-reporting.json
                    if-no-files-found: error
                    retention-days: 30

                - name: Enforce production readback result
                  if: always() && (steps.readback.outcome != 'success' || steps.security_setting.outcome != 'success')
                  run: exit 1
          '''
          production_yml = "\n".join(line[10:] if line.startswith("          ") else line for line in production_yml.splitlines()) + "\n"

          Path(".github/workflows/validate.yml").write_text(validate_yml, encoding="utf-8")
          Path(".github/workflows/production-readback.yml").write_text(production_yml, encoding="utf-8")

          validator_path = Path("scripts/validate_security_policy.py")
          validator = validator_path.read_text(encoding="utf-8")
          old_hashes = '''EXPECTED_WORKFLOW_SHA256 = {
              VALIDATE_WORKFLOW: "fe02ff290cde4bdabdfd6ef92ec4b6d94977125f8bf7980b8c3663d695ae61ed",
              PRODUCTION_READBACK_WORKFLOW: "553c04d7eb0b814d14453e7c59093a147153a10af96e92a84e4d8be55eaed628",
              SECURITY_EXPIRY_WORKFLOW: "1f5e132ce88792380d6eace0140ab62bb29c514d9743d6d52a1be0d965ae12cc",
          }
          '''
          new_hashes = '''EXPECTED_WORKFLOW_SHA256 = {
              VALIDATE_WORKFLOW: "864632390495940a9a55ddc187cff9d54fe98e6f69bd700b63157460fba09711",
              PRODUCTION_READBACK_WORKFLOW: "38925e9c0aa384170456bb26bfe92fd82209904e3936f85ddc9aba9a47d96ef3",
              SECURITY_EXPIRY_WORKFLOW: "1f5e132ce88792380d6eace0140ab62bb29c514d9743d6d52a1be0d965ae12cc",
          }
          EXPECTED_WORKFLOW_STRUCTURE_SHA256 = {
              VALIDATE_WORKFLOW: "cc3bb2f6279adbe4898339f7f8e4bf7e72602f157df16a5adbb5c1d905956287",
              PRODUCTION_READBACK_WORKFLOW: "74733a9216526b94226da63c73e800b3a7466db2e6a1fd0281d8e4e11ce0419a",
              SECURITY_EXPIRY_WORKFLOW: "e605a19f5a7f379fe03b418d84d86d0a9cc54bcf4f2898599c9e99098278e1de",
          }
          '''
          assert validator.count(old_hashes) == 1
          validator = validator.replace(old_hashes, new_hashes, 1)

          compose_marker = '''def _compose_workflow(workflow_text: str) -> Node | None:
              try:
                  return yaml.compose(workflow_text, Loader=yaml.BaseLoader)
              except yaml.YAMLError:
                  return None


          '''
          structure_helpers = '''def _compose_workflow(workflow_text: str) -> Node | None:
              try:
                  return yaml.compose(workflow_text, Loader=yaml.BaseLoader)
              except yaml.YAMLError:
                  return None


          def _workflow_structure_value(node: Node, errors: list[str], scope: str) -> object:
              if isinstance(node, ScalarNode):
                  return {"kind": "scalar", "value": node.value}
              if isinstance(node, SequenceNode):
                  return {
                      "kind": "sequence",
                      "items": [
                          _workflow_structure_value(item, errors, f"{scope}[{index}]")
                          for index, item in enumerate(node.value)
                      ],
                  }
              if isinstance(node, MappingNode):
                  entries: list[list[object]] = []
                  seen: set[str] = set()
                  for key_node, value_node in node.value:
                      if not isinstance(key_node, ScalarNode):
                          errors.append(f"{scope} contains a non-scalar mapping key")
                          continue
                      key = key_node.value
                      if key in seen:
                          errors.append(f"duplicate {scope} field: {key}")
                          continue
                      seen.add(key)
                      entries.append([
                          key,
                          _workflow_structure_value(value_node, errors, f"{scope}.{key}"),
                      ])
                  return {"kind": "mapping", "entries": entries}
              errors.append(f"{scope} contains an unsupported YAML node")
              return {"kind": "invalid"}


          def _workflow_structure_digest(workflow_text: str, errors: list[str], label: str) -> str | None:
              root = _compose_workflow(workflow_text)
              if root is None:
                  errors.append(f"{label} must be valid YAML")
                  return None
              structure = _workflow_structure_value(root, errors, label)
              canonical = json.dumps(
                  structure,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("utf-8")
              return hashlib.sha256(canonical).hexdigest()


          '''
          assert validator.count(compose_marker) == 1
          validator = validator.replace(compose_marker, structure_helpers, 1)

          byte_check = '''    for relative, expected_sha256 in EXPECTED_WORKFLOW_SHA256.items():
                  actual_sha256 = hashlib.sha256((root / relative).read_bytes()).hexdigest()
                  if actual_sha256 != expected_sha256:
                      errors.append(
                          f"security workflow bytes changed without reviewed digest update: {relative}; "
                          f"expected {expected_sha256}, got {actual_sha256}"
                      )

          '''
          semantic_check = byte_check + '''    for relative, expected_sha256 in EXPECTED_WORKFLOW_STRUCTURE_SHA256.items():
                  workflow_errors: list[str] = []
                  actual_sha256 = _workflow_structure_digest(
                      (root / relative).read_text(encoding="utf-8"),
                      workflow_errors,
                      str(relative),
                  )
                  errors.extend(workflow_errors)
                  if actual_sha256 is not None and actual_sha256 != expected_sha256:
                      errors.append(
                          f"security workflow structure changed without reviewed contract update: {relative}; "
                          f"expected {expected_sha256}, got {actual_sha256}"
                      )

          '''
          assert validator.count(byte_check) == 1
          validator = validator.replace(byte_check, semantic_check, 1)

          old_production_sequence = '''        (
                      "Install security validation dependencies",
                      "Verify exact Pages deployment and public content",
                      "Verify private vulnerability reporting setting",
                      "Upload production readback receipts",
                      "Enforce production readback result",
                  ),
          '''
          new_production_sequence = '''        (
                      "Verify exact Pages deployment and public content",
                      "Install security validation dependencies",
                      "Verify private vulnerability reporting setting",
                      "Upload Pages production readback receipt",
                      "Upload private reporting production receipt",
                      "Enforce production readback result",
                  ),
          '''
          assert validator.count(old_production_sequence) == 1
          validator = validator.replace(old_production_sequence, new_production_sequence, 1)

          old_prod_fields = '''        fields={"id": "security_setting", "continue-on-error": "true"},
          '''
          new_prod_fields = '''        fields={"id": "security_setting", "if": "always()", "continue-on-error": "true"},
          '''
          assert validator.count(old_prod_fields) == 2
          first = validator.index(old_prod_fields, validator.index('production = _require_structured_step'))
          validator = validator[:first] + validator[first:].replace(old_prod_fields, new_prod_fields, 1)

          old_upload = '''    _require_structured_step(
                  production_text,
                  "Upload production readback receipts",
                  errors,
                  "production readback workflow",
                  fields={"if": "always()", "uses": "actions/upload-artifact@v7"},
                  with_fields={
                      "path": "artifacts/commonworld-pages-production-readback.json\\nartifacts/commonworld-private-vulnerability-reporting.json",
                      "if-no-files-found": "error", "retention-days": "30",
                  },
                  forbidden_fields=("continue-on-error", "shell"),
              )
          '''
          new_upload = '''    _require_structured_step(
                  production_text,
                  "Upload Pages production readback receipt",
                  errors,
                  "production readback workflow",
                  fields={"if": "always()", "uses": "actions/upload-artifact@v7"},
                  with_fields={
                      "name": "commonworld-pages-production-readback-${{ github.sha }}",
                      "path": "artifacts/commonworld-pages-production-readback.json",
                      "if-no-files-found": "error",
                      "retention-days": "30",
                  },
                  forbidden_fields=("continue-on-error", "shell"),
              )
              _require_structured_step(
                  production_text,
                  "Upload private reporting production receipt",
                  errors,
                  "production readback workflow",
                  fields={"if": "always()", "uses": "actions/upload-artifact@v7"},
                  with_fields={
                      "name": "commonworld-private-vulnerability-reporting-${{ github.sha }}",
                      "path": "artifacts/commonworld-private-vulnerability-reporting.json",
                      "if-no-files-found": "error",
                      "retention-days": "30",
                  },
                  forbidden_fields=("continue-on-error", "shell"),
              )
          '''
          assert validator.count(old_upload) == 1
          validator = validator.replace(old_upload, new_upload, 1)
          validator_path.write_text(validator, encoding="utf-8")

          tests_path = Path("tests/test_security_policy.py")
          tests = tests_path.read_text(encoding="utf-8")
          tests = tests.replace(
              'split("- name: Upload production readback receipts", 1)[0]',
              'split("- name: Upload Pages production readback receipt", 1)[0]',
          )
          marker = '''if __name__ == "__main__":
              unittest.main()
          '''
          additions = '''    def test_workflow_trigger_value_changes_are_semantically_rejected(self) -> None:
                  with tempfile.TemporaryDirectory() as directory:
                      root = self.copy_surface(directory)
                      path = root / ".github/workflows/validate.yml"
                      path.write_text(
                          path.read_text(encoding="utf-8").replace("  pull_request:\\n", "  workflow_dispatch:\\n", 1),
                          encoding="utf-8",
                      )
                      errors = validate_security_policy(root, now=self.NOW)
                  self.assertTrue(any("security workflow structure changed" in error for error in errors), errors)

              def test_unreviewed_predecessor_step_is_semantically_rejected(self) -> None:
                  with tempfile.TemporaryDirectory() as directory:
                      root = self.copy_surface(directory)
                      path = root / ".github/workflows/production-readback.yml"
                      text = path.read_text(encoding="utf-8")
                      marker = "      - name: Verify exact Pages deployment and public content\\n"
                      injected = (
                          "      - name: Poison command path\\n"
                          "        run: echo /tmp/fake >> \\"$GITHUB_PATH\\"\\n\\n"
                          + marker
                      )
                      path.write_text(text.replace(marker, injected, 1), encoding="utf-8")
                      errors = validate_security_policy(root, now=self.NOW)
                  self.assertTrue(any("security workflow structure changed" in error for error in errors), errors)

              def test_production_receipts_are_uploaded_independently(self) -> None:
                  workflow = (ROOT / ".github/workflows/production-readback.yml").read_text(encoding="utf-8")
                  self.assertIn("Upload Pages production readback receipt", workflow)
                  self.assertIn("Upload private reporting production receipt", workflow)
                  self.assertNotIn("Upload production readback receipts", workflow)


          '''
          assert tests.count(marker) == 1
          tests = tests.replace(marker, additions + marker, 1)
          tests_path.write_text(tests, encoding="utf-8")

          Path(".github/workflows/patch-security-policy-final-v1.yml").unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(security): bind complete workflow proof"
          git push origin HEAD:feat/security-policy-v1
