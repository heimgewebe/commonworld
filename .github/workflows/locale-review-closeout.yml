name: locale-review-closeout

on:
  push:
    branches:
      - fix/locale-review-closeout-v1

permissions:
  contents: write

concurrency:
  group: locale-review-closeout-v1
  cancel-in-progress: false

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/locale-review-closeout-v1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Apply review closeout
        run: python3 scripts/apply_locale_review_closeout.py
      - name: Install public runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install bounded browser runtime
        run: npx playwright install --with-deps chromium
      - name: Rebuild deterministic public runtime
        run: npm run build
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate canonical contracts and tests
        run: make validate
      - name: Run complete browser smoke plan
        run: npm run smoke:browser
      - name: Commit verified implementation
        env:
          BRANCH: fix/locale-review-closeout-v1
        run: |
          rm -f scripts/apply_locale_review_closeout.py .github/workflows/locale-review-closeout.yml
          git config user.name "commonworld-review-closeout[bot]"
          git config user.email "commonworld-review-closeout[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(i18n): close Wave-1 locale review findings"
          git push origin "HEAD:${BRANCH}"
