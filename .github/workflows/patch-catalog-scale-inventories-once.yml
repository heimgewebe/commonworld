name: Patch catalog scale inventories once

on:
  push:
    branches:
      - feat/catalog-scale-gates-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/catalog-scale-gates-v1
          fetch-depth: 0
      - name: Extend canonical inventories
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/validate_canonical_plan.py')
          workflow = Path('.github/workflows/patch-catalog-scale-inventories-once.yml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'EXPECTED_CONTRACT_FILES = {"catalog-platform.contract.json", "catalog-delivery-budget.contract.json",':
                  'EXPECTED_CONTRACT_FILES = {"catalog-platform.contract.json", "catalog-delivery-budget.contract.json", "catalog-scale-gates.contract.json",',
              '    "validate_catalog_delivery_budget.py",\n    "validate_proposal_path.py",':
                  '    "validate_catalog_delivery_budget.py",\n    "validate_catalog_scale_gates.py",\n    "validate_catalog_scale_masterplan.py",\n    "validate_proposal_path.py",',
              '    "test_catalog_platform.py",\n    "test_proposal_path.py",':
                  '    "test_catalog_platform.py",\n    "test_catalog_scale_gates.py",\n    "test_catalog_scale_masterplan.py",\n    "test_proposal_path.py",',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'canonical inventory fragment did not match exactly once: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          workflow.unlink()
          PY
      - name: Commit inventory correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/validate_canonical_plan.py .github/workflows/patch-catalog-scale-inventories-once.yml
          git diff --cached --check
          git commit -m 'fix(plan): inventory catalog scale gates'
          git push origin HEAD:feat/catalog-scale-gates-v1
