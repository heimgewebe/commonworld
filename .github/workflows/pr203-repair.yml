name: PR203 bounded repair

on:
  push:
    branches:
      - fix/touch-ring-orbit-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/touch-ring-orbit-v1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install runtime and validation dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          python -m pip install -r requirements-dev.txt
      - name: Repair, regenerate, validate and push PR head
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/pr203_repair.py')
          source = path.read_text()
          old = "    --ring-orbit-direction: 0;\n"
          new = "    animation-duration: var(--ring-orbit-duration, 240s) !important;\n    animation-iteration-count: infinite !important;\n    --ring-orbit-direction: 0;\n"
          if old not in source:
              raise SystemExit('reduced-motion orbit insertion point missing')
          path.write_text(source.replace(old, new, 1))
          PY
          set -o pipefail
          python3 .github/pr203_repair.py 2>&1 | tee pr203-repair.log
      - name: Preserve repair log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr203-repair-log
          path: pr203-repair.log
          if-no-files-found: error
