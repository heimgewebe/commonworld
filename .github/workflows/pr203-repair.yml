name: PR203 bounded repair

on:
  push:
    branches:
      - fix/touch-ring-orbit-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/touch-ring-orbit-v1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install runtime and validation dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          python -m pip install -r requirements-dev.txt
      - name: Prepare final product tree and validation driver
        run: |
          python3 .github/pr203_finalize.py
          rm .github/pr203_finalize.py
          git show 14b2310e286222207447167649121673f2aaff1f:.github/pr203_repair.py > .github/pr203_repair.py
          python3 .github/pr203_validate_driver.py
      - name: Regenerate, validate and push final PR head
        run: |
          set -o pipefail
          python3 .github/pr203_repair.py 2>&1 | tee pr203-repair.log
      - name: Preserve repair log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr203-repair-log
          path: pr203-repair.log
          if-no-files-found: warn
