name: pr143-finalize

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: read

concurrency:
  group: pr143-finalize
  cancel-in-progress: true

jobs:
  package:
    if: github.event.pull_request.head.ref == 'feat/digital-detail-unification-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/digital-detail-unification-v1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exact Node and browser dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install chromium
      - name: Patch and rebuild final product surface
        run: |
          python3 scripts/pr143_finalize.py patch
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.css')
          text = path.read_text(encoding='utf-8')
          old = """  .project-detail-header {
              grid-template-columns: minmax(0, 1.35fr) minmax(12rem, 0.65fr);
              gap: 1rem;
            }"""
          new = """  .project-detail-header {
              grid-template-columns: minmax(0, 1fr);
              gap: 0.9rem;
            }"""
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('low-height project detail header contract not found')
          path.write_text(text, encoding='utf-8')
          PY
          npm run build
          git diff --check
      - name: Package checkout and browser runtime
        run: |
          tar --exclude=.git -czf /tmp/pr143-workspace.tgz .
          tar -C "$HOME/.cache" -czf /tmp/pr143-playwright-cache.tgz ms-playwright
          sha256sum /tmp/pr143-workspace.tgz /tmp/pr143-playwright-cache.tgz > /tmp/pr143-package.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pr143-controlled-workspace
          path: |
            /tmp/pr143-workspace.tgz
            /tmp/pr143-playwright-cache.tgz
            /tmp/pr143-package.sha256
          compression-level: 0
          retention-days: 1
