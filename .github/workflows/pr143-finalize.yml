name: pr143-finalize

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: pr143-finalize
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'feat/digital-detail-unification-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/digital-detail-unification-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          python -m pip install -r requirements-dev.txt
      - name: Patch low-height detail layout
        run: |
          python scripts/pr143_finalize.py patch
          python - <<'PY'
          from pathlib import Path
          path = Path('index.css')
          text = path.read_text(encoding='utf-8')
          old = """  .project-detail-header {
              grid-template-columns: minmax(0, 1.35fr) minmax(12rem, 0.65fr);
              gap: 1rem;
            }"""
          new = """  .project-detail-header {
              grid-template-columns: minmax(0, 1fr);
              gap: 0.9rem;
            }"""
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('low-height project detail header contract not found')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify deterministic generated surfaces
        run: |
          npm run build
          git diff --check
          git diff --binary -- de.html index.html method.de.html method.html assets/commonworld-bootstrap-catalog.mjs assets/commonworld-en-locale.mjs > /tmp/generated-before.diff
          npm run build
          git diff --binary -- de.html index.html method.de.html method.html assets/commonworld-bootstrap-catalog.mjs assets/commonworld-en-locale.mjs > /tmp/generated-after.diff
          cmp /tmp/generated-before.diff /tmp/generated-after.diff
      - name: Measure static delivery
        run: python scripts/measure_catalog_delivery.py --output /tmp/pr143-static.json
      - name: Measure throttled browser delivery
        run: node scripts/measure_catalog_delivery_browser.mjs --output /tmp/pr143-browser.json
      - name: Run public browser evidence
        run: node scripts/smoke_public_browser.mjs --result /tmp/pr143-smoke.json
      - name: Upload finalizer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr143-finalizer-diagnostics
          path: |
            /tmp/pr143-static.json
            /tmp/pr143-browser.json
            /tmp/pr143-smoke.json
            /tmp/generated-before.diff
            /tmp/generated-after.diff
          if-no-files-found: warn
          retention-days: 1
      - name: Bind benchmark, smoke and review evidence
        run: |
          python scripts/pr143_finalize.py bind \
            --static /tmp/pr143-static.json \
            --browser /tmp/pr143-browser.json \
            --smoke /tmp/pr143-smoke.json
      - name: Full validation
        run: |
          git diff --check
          make validate
          npm run smoke:browser
          git diff --check
      - name: Commit finalized PR head
        env:
          BRANCH: feat/digital-detail-unification-v1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr143-finalize.yml scripts/pr143_finalize.py
          git add -A
          git diff --cached --check
          git commit -m "fix: keep low-height digital details reachable"
          git fetch origin main
          git diff --binary origin/main...HEAD > /tmp/pr143-final.diff
          printf 'FINAL_HEAD=%s\n' "$(git rev-parse HEAD)"
          printf 'FINAL_DIFF_SHA256=%s\n' "$(sha256sum /tmp/pr143-final.diff | cut -d' ' -f1)"
          printf 'FINAL_DIFF_BYTES=%s\n' "$(wc -c < /tmp/pr143-final.diff)"
          git push origin "HEAD:${BRANCH}"
