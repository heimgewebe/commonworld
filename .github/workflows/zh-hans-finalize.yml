name: zh-hans-editorial-finalize

on:
  push:
    branches:
      - feat/zh-hans-complete-v1

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, 'run zh-Hans editorial finalize')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/zh-hans-complete-v1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Apply reviewed Simplified Chinese corrections
        run: |
          PYTHONPATH=. python scripts/_tmp_finalize_zh_hans.py
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/_tmp_fix_zh_hans_locale_contracts.py')
          text = path.read_text(encoding='utf-8')
          old = "marker = '    def test_runtime_registry_tracks_contract_lifecycle(self) -> None:\\n'"
          new = "marker = '    def test_primary_subtag_matches_region_specific_released_locale(self) -> None:\\n'"
          if old not in text:
              raise SystemExit('expected temporary test anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          PYTHONPATH=. python scripts/_tmp_fix_zh_hans_locale_contracts.py
          python - <<'PY'
          import json
          from pathlib import Path

          pack_path = Path('assets/locales/wave1-locales.json')
          pack = json.loads(pack_path.read_text(encoding='utf-8'))
          pack['locales']['zh-Hans']['ui']['show_more_in_bundle'] = '再显示 {count} 个 Commons（{label}）'
          pack_path.write_text(json.dumps(pack, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          runtime_path = Path('scripts/build_locale_runtime.py')
          runtime = runtime_path.read_text(encoding='utf-8')
          runtime = runtime.replace(r'/^\d{{3}}$/.test(part)', r'/^[0-9]{{3}}$/.test(part)')
          runtime_path.write_text(runtime, encoding='utf-8')

          test_path = Path('tests/test_locale_release_contract.py')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace('contract["decision"]["default_locale"] = "zh-Hans"\n        contract["decision"]["fallback_locale"] = "hi"', 'contract["decision"]["default_locale"] = "hi"\n        contract["decision"]["fallback_locale"] = "ja"')
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Rebuild deterministic runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Run pre-evidence product regressions
        run: |
          python -m unittest tests.test_i18n -v
          npm test
      - name: Remove one-shot machinery
        run: rm scripts/_tmp_finalize_zh_hans.py scripts/_tmp_fix_zh_hans_locale_contracts.py .github/workflows/zh-hans-finalize.yml
      - name: Commit corrected review source
        run: |
          git config user.name 'grabowski-operator'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'fix(i18n): editorially correct zh-Hans and demand-gate future locales'
          git push origin HEAD:feat/zh-hans-complete-v1
