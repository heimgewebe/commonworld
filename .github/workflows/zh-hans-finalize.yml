name: zh-hans-editorial-finalize

on:
  push:
    branches:
      - feat/zh-hans-complete-v1

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, 'run zh-Hans editorial finalize')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/zh-hans-complete-v1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Apply reviewed Simplified Chinese corrections
        run: |
          PYTHONPATH=. python scripts/_tmp_finalize_zh_hans.py
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/_tmp_fix_zh_hans_locale_contracts.py')
          text = path.read_text(encoding='utf-8')
          old = "marker = '    def test_runtime_registry_tracks_contract_lifecycle(self) -> None:\\n'"
          new = "marker = '    def test_primary_subtag_matches_region_specific_released_locale(self) -> None:\\n'"
          if old not in text:
              raise SystemExit('expected temporary test anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          PYTHONPATH=. python scripts/_tmp_fix_zh_hans_locale_contracts.py
          python - <<'PY'
          import json
          from pathlib import Path

          pack_path = Path('assets/locales/wave1-locales.json')
          pack = json.loads(pack_path.read_text(encoding='utf-8'))
          pack['locales']['zh-Hans']['ui']['show_more_in_bundle'] = '再显示 {count} 个 Commons（{label}）'
          pack_path.write_text(json.dumps(pack, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          runtime_path = Path('scripts/build_locale_runtime.py')
          runtime = runtime_path.read_text(encoding='utf-8')
          runtime = runtime.replace(r'/^\d{{3}}$/.test(part)', r'/^[0-9]{{3}}$/.test(part)')
          runtime_path.write_text(runtime, encoding='utf-8')

          locale_path = Path('assets/commonworld-locale.mjs')
          locale_source = locale_path.read_text(encoding='utf-8')
          old_matcher = '''export function matchSupportedLocaleTag(value, supportedLocales = RELEASED_LOCALES) {
  const canonical = canonicalLocaleTag(value);
  if (!canonical) return null;
  const allowed = Array.isArray(supportedLocales) ? supportedLocales : RELEASED_LOCALES;
  const exact = allowed.find((tag) => tag.toLowerCase() === canonical.toLowerCase());
  if (exact) return exact;
  const parts = canonical.split('-');
  if (parts.length >= 2 && parts[1].length === 4) {
    const languageScript = parts.slice(0, 2).join('-').toLowerCase();
    const scriptMatch = allowed.find((tag) => tag.toLowerCase() === languageScript);
    if (scriptMatch) return scriptMatch;
  }
  const primary = parts[0].toLowerCase();
  return allowed.find((tag) => tag.split('-')[0].toLowerCase() === primary) ?? null;
}
'''
          new_matcher = '''export function matchSupportedLocaleTag(value, supportedLocales = RELEASED_LOCALES) {
  const canonical = canonicalLocaleTag(value);
  if (!canonical) return null;
  const allowed = Array.isArray(supportedLocales) ? supportedLocales : RELEASED_LOCALES;
  const exact = allowed.find((tag) => tag.toLowerCase() === canonical.toLowerCase());
  if (exact) return exact;
  const parts = canonical.split('-');
  const primary = parts[0].toLowerCase();
  const explicitScript = parts.length >= 2 && parts[1].length === 4 ? parts[1] : null;
  const region = parts.find((part, index) => index > 0 && (part.length === 2 || /^[0-9]{3}$/.test(part))) ?? null;
  const inferredChineseScript = primary === 'zh' && region
    ? (['TW', 'HK', 'MO'].includes(region.toUpperCase()) ? 'Hant' : ['CN', 'SG'].includes(region.toUpperCase()) ? 'Hans' : null)
    : null;
  const requestedScript = explicitScript ?? inferredChineseScript;
  if (requestedScript) {
    const languageScript = `${primary}-${requestedScript}`.toLowerCase();
    const scriptMatch = allowed.find((tag) => tag.toLowerCase() === languageScript);
    if (scriptMatch) return scriptMatch;
    const scriptlessPrimary = allowed.find((tag) => {
      const candidateParts = tag.split('-');
      return candidateParts[0].toLowerCase() === primary
        && !(candidateParts.length >= 2 && candidateParts[1].length === 4);
    });
    return scriptlessPrimary ?? null;
  }
  return allowed.find((tag) => tag.split('-')[0].toLowerCase() === primary) ?? null;
}
'''
          if old_matcher not in locale_source:
              raise SystemExit('expected commonworld-locale matcher missing')
          locale_path.write_text(locale_source.replace(old_matcher, new_matcher, 1), encoding='utf-8')

          test_path = Path('tests/test_locale_release_contract.py')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace('contract["decision"]["default_locale"] = "zh-Hans"\n        contract["decision"]["fallback_locale"] = "hi"', 'contract["decision"]["default_locale"] = "hi"\n        contract["decision"]["fallback_locale"] = "ja"')
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Rebuild deterministic runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Run pre-evidence product regressions
        run: |
          python -m unittest tests.test_i18n -v
          npm test
      - name: Remove one-shot machinery
        run: rm scripts/_tmp_finalize_zh_hans.py scripts/_tmp_fix_zh_hans_locale_contracts.py .github/workflows/zh-hans-finalize.yml
      - name: Commit corrected review source
        run: |
          git config user.name 'grabowski-operator'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'fix(i18n): editorially correct zh-Hans and demand-gate future locales'
          git push origin HEAD:feat/zh-hans-complete-v1
