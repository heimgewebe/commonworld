name: finalize-pr-198-v3

on:
  push:
    branches:
      - fix/wave1-nonblocking-globe-v1

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/wave1-nonblocking-globe-v1
          fetch-depth: 50
      - name: Prepare runtime and smoke fixes
        run: |
          git config user.name "grabowski-operator"
          git config user.email "grabowski-operator@users.noreply.github.com"
          git show 6d75eb997b178f0df9bc28171dbbeb91ff2e9241:.github/workflows/validate.yml > .github/workflows/validate.yml
          python3 - <<'PY'
          from pathlib import Path

          app = Path('assets/commonworld-app.js')
          source = app.read_text(encoding='utf-8')
          replacements = [
              (
                  "  layerReturnFocusTimer: null,\n",
                  "  layerReturnFocusTimer: null,\n  focusInteractionGeneration: 0,\n",
              ),
              (
                  "function installInputModalityTracking() {\n  const usePointerModality = () => setInputModality('pointer');\n  const useKeyboardModality = (event) => {\n    if (event.metaKey || event.ctrlKey || event.altKey) return;\n    setInputModality('keyboard');\n  };\n",
                  "function installInputModalityTracking() {\n  const usePointerModality = () => {\n    runtime.focusInteractionGeneration += 1;\n    setInputModality('pointer');\n  };\n  const useKeyboardModality = (event) => {\n    if (event.metaKey || event.ctrlKey || event.altKey) return;\n    runtime.focusInteractionGeneration += 1;\n    setInputModality('keyboard');\n  };\n",
              ),
              (
                  "  runtime.layerReturnTarget = null;\n  let attempt = 0;\n  const tryFocus = () => {\n    runtime.layerReturnFocusTimer = null;\n    if (document.activeElement === target) return;\n    const active = document.activeElement;\n    const userSelectedAnotherTarget = active !== document.body\n      && active !== document.documentElement\n      && isVisibleFocusTarget(active);\n    if (attempt > 0 && userSelectedAnotherTarget) return;\n",
                  "  runtime.layerReturnTarget = null;\n  const interactionGeneration = runtime.focusInteractionGeneration;\n  let attempt = 0;\n  const tryFocus = () => {\n    runtime.layerReturnFocusTimer = null;\n    if (document.activeElement === target) return;\n    const userInteractedSinceRestore = runtime.focusInteractionGeneration !== interactionGeneration;\n    if (attempt > 0 && userInteractedSinceRestore) return;\n",
              ),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one app match, found {count}: {old!r}')
              source = source.replace(old, new, 1)
          app.write_text(source, encoding='utf-8')

          smoke = Path('scripts/smoke_public_browser.mjs')
          source = smoke.read_text(encoding='utf-8')
          old = """  // An artificially slow CSS opacity transition must not delay the bounded
          // overview return. MapLibre may finish its camera lifecycle just after the
          // UI fail-safe, so require prompt camera settlement without coupling the
          // smoke to scheduler-sensitive event timestamp ordering.
          await run.page.locator('#map').evaluate((node) => { node.style.transitionDuration = '10s'; });
          const startedAt = Date.now();
          await run.page.locator('#layer-close').click();
          await run.page.waitForSelector('.globe-stage[data-view-phase=\"overview\"]');
          const elapsed = Date.now() - startedAt;
          assert(elapsed < 5000, `moveend return: completion waited for CSS instead of the MapLibre camera lifecycle (${elapsed}ms)`);
          await run.page.waitForFunction(() => window.__commonworldTestMap?.isMoving() === false, null, { timeout: 3_000 });
          """
          new = """  // Make CSS effectively non-terminal for this scenario and prove the return
          // directly against MapLibre's lifecycle. A CSS-bound implementation would never
          // reach overview within the normal smoke timeout.
          await run.page.evaluate(() => {
            const map = window.__commonworldTestMap;
            window.__commonworldReturnMoveendObserved = false;
            window.__commonworldCameraCommands = [];
            map.once('moveend', () => { window.__commonworldReturnMoveendObserved = true; });
            document.querySelector('#map').style.transitionDuration = '3600s';
          });
          await run.page.locator('#layer-close').click();
          await run.page.waitForSelector('.globe-stage[data-view-phase=\"overview\"]');
          const returnLifecycle = await run.page.evaluate(() => ({
            moveendObserved: window.__commonworldReturnMoveendObserved === true,
            moving: window.__commonworldTestMap?.isMoving?.() ?? null,
            commands: window.__commonworldCameraCommands ?? [],
            cssTransitionDuration: getComputedStyle(document.querySelector('#map')).transitionDuration,
          }));
          assert(returnLifecycle.moveendObserved, `moveend return: overview completed without observing MapLibre moveend (${JSON.stringify(returnLifecycle)})`);
          assert(returnLifecycle.moving === false, `moveend return: overview completed while MapLibre was still moving (${JSON.stringify(returnLifecycle)})`);
          assert(returnLifecycle.commands.length === 1 && returnLifecycle.commands[0].command === 'easeTo', `moveend return: return was not one MapLibre camera command (${JSON.stringify(returnLifecycle)})`);
          assert(returnLifecycle.cssTransitionDuration.includes('3600s'), `moveend return: synthetic CSS guard was not active (${JSON.stringify(returnLifecycle)})`);
          """
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one moveend smoke block, found {count}')
          source = source.replace(old, new, 1)
          source = source.replace(
              "  results.push({ id: 'layer-journey-moveend-return', verdict: 'PASS', elapsedMs: elapsed });\n",
              "  results.push({ id: 'layer-journey-moveend-return', verdict: 'PASS', moveendObserved: true, cssTransitionDuration: '3600s' });\n",
              1,
          )
          smoke.write_text(source, encoding='utf-8')
          PY
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies and browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          python -m pip install -r requirements-dev.txt
      - name: Build generated surfaces and bind locale evidence
        run: |
          npm run build
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path('.')
          contract_path = root / 'docs/architecture/locale-release.contract.json'
          contract = json.loads(contract_path.read_text(encoding='utf-8'))
          for locale in ('es', 'fr', 'pt-BR', 'ar'):
              entry = contract['locale_registry'][locale]
              evidence_path = root / entry['release_evidence']['path']
              evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
              evidence['surface_sha256'] = {
                  surface: hashlib.sha256((root / relative).read_bytes()).hexdigest()
                  for surface, relative in entry['surface_files'].items()
              }
              evidence_path.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              entry['release_evidence']['sha256'] = hashlib.sha256(evidence_path.read_bytes()).hexdigest()
          contract_path.write_text(json.dumps(contract, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python3 scripts/measure_release_snapshot_lifecycle.py
          git diff > /tmp/tree-before-second-build.patch
          npm run build
          git diff > /tmp/tree-after-second-build.patch
          cmp /tmp/tree-before-second-build.patch /tmp/tree-after-second-build.patch
      - name: Measure catalogue delivery
        run: |
          python3 scripts/measure_catalog_delivery.py --output /tmp/catalog-static.json >/dev/null
          node scripts/measure_catalog_delivery_browser.mjs --output /tmp/catalog-browser-1.json >/dev/null
          set +e
          python3 scripts/evaluate_catalog_browser_measurements.py --attempt /tmp/catalog-browser-1.json --output /tmp/catalog-browser-decision.json
          decision_rc=$?
          set -e
          if [ "$decision_rc" -eq 2 ]; then
            node scripts/measure_catalog_delivery_browser.mjs --output /tmp/catalog-browser-2.json >/dev/null
            python3 scripts/evaluate_catalog_browser_measurements.py --attempt /tmp/catalog-browser-1.json --attempt /tmp/catalog-browser-2.json --output /tmp/catalog-browser-decision.json
          elif [ "$decision_rc" -ne 0 ]; then
            exit "$decision_rc"
          fi
      - name: Run fresh canonical public browser smoke
        run: node scripts/smoke_public_browser.mjs --result /tmp/public-smoke.json
      - name: Bind fresh catalogue and smoke evidence
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path('.')
          benchmark_path = root / 'docs/evidence/catalog-delivery-benchmark-v1.json'
          smoke_path = root / 'docs/evidence/catalog-delivery-public-browser-smoke-v1.json'
          budget_path = root / 'contracts/commonworld/catalog-delivery-budget.contract.json'
          benchmark = json.loads(benchmark_path.read_text(encoding='utf-8'))
          static = json.loads(Path('/tmp/catalog-static.json').read_text(encoding='utf-8'))
          browser = json.loads(Path('/tmp/catalog-browser-decision.json').read_text(encoding='utf-8'))
          fresh_smoke = json.loads(Path('/tmp/public-smoke.json').read_text(encoding='utf-8'))
          budgets = json.loads(budget_path.read_text(encoding='utf-8'))['budgets']
          benchmark['optimized']['static'] = static
          benchmark['optimized']['browser'] = browser
          benchmark['budget_binding'] = {
              'bootstrap_gzip_bytes': static['bootstrap']['gzip_bytes'],
              'warn_bootstrap_gzip_bytes': budgets['warn_bootstrap_gzip_bytes'],
              'max_bootstrap_gzip_bytes': budgets['max_bootstrap_gzip_bytes'],
          }
          baseline_static = benchmark['baseline']['static']
          delta = benchmark['delta']
          delta['startup_project_json_requests'] = static['runtime_verification_fetch']['project_request_count'] - baseline_static['runtime_verification_fetch']['project_request_count']
          delta['duplicate_identity_payload_count'] = static['runtime_verification_fetch']['duplicate_identity_payload_count'] - baseline_static['runtime_verification_fetch']['duplicate_identity_payload_count']
          delta['catalog_initial_raw_bytes'] = static['catalog_initial_delivery']['raw_bytes'] - baseline_static['catalog_initial_delivery']['raw_bytes']
          delta['catalog_initial_gzip_bytes'] = static['catalog_initial_delivery']['gzip_bytes'] - baseline_static['catalog_initial_delivery']['gzip_bytes']
          delta['catalog_initial_raw_reduction_percent'] = round((-delta['catalog_initial_raw_bytes'] / baseline_static['catalog_initial_delivery']['raw_bytes']) * 100, 1)
          delta['catalog_initial_gzip_reduction_percent'] = round((-delta['catalog_initial_gzip_bytes'] / baseline_static['catalog_initial_delivery']['gzip_bytes']) * 100, 1)
          baseline_profiles = {p['profile']: p for p in benchmark['baseline']['browser']['profiles']}
          optimized_profiles = {p['profile']: p for p in browser['profiles']}
          delta['first_party_request_count_by_profile'] = {
              name: optimized_profiles[name]['first_party_request_count'] - p['first_party_request_count']
              for name, p in baseline_profiles.items() if name in optimized_profiles
          }
          delta['browser_dom_nodes_by_profile'] = {
              name: optimized_profiles[name]['dom_node_count'] - p['dom_node_count']
              for name, p in baseline_profiles.items() if name in optimized_profiles
          }
          benchmark_path.write_text(json.dumps(benchmark, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          fresh_smoke['binding'] = {
              'smoke_script_sha256': sha('scripts/smoke_public_browser.mjs'),
              'smoke_runner_sha256': sha('scripts/run_browser_smoke.py'),
              'smoke_plan_sha256': sha('scripts/browser_smoke_plan.py'),
              'scenario_ids': [scenario['id'] for scenario in fresh_smoke['scenarios']],
              'first_party_surface_sha256': browser['first_party_surface_sha256'],
          }
          smoke_path.write_text(json.dumps(fresh_smoke, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validate exact final tree
        run: |
          python3 scripts/measure_release_snapshot_lifecycle.py
          make validate
          npm run smoke:browser
          git diff --check origin/main...HEAD
      - name: Commit and push exact validated final head
        run: |
          rm -f .github/workflows/finalize-pr-198.yml .github/workflows/finalize-pr-198-v2.yml .github/workflows/finalize-pr-198-v3.yml
          git add -A
          git diff --cached --check
          git commit -m "fix(i18n): preserve late Wave-1 locale completion"
          FINAL_HEAD=$(git rev-parse HEAD)
          echo "validated final head: $FINAL_HEAD"
          git push origin HEAD:fix/wave1-nonblocking-globe-v1
